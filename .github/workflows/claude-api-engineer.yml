name: Claude API Engineer

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task for Claude"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  interactive:
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      github.actor == 'caglarmurat10-ui' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Run Claude API engineer
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 20
            --append-system-prompt "Read and follow CLAUDE.md before making changes. Work conservatively. Never deploy production, add paid services, create ads, add payment methods, expose secrets, or weaken the Destan Instagram hard block unless the repository owner explicitly asks in the triggering task. Run the relevant tests and builds before claiming success."
            --allowedTools "Bash(npm ci),Bash(npm test),Bash(npm run lint),Bash(npm run build),Bash(npx opennextjs-cloudflare build),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"

  manual:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'caglarmurat10-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Run requested Claude API task
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ inputs.prompt }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 20
            --append-system-prompt "Read and follow CLAUDE.md before making changes. Work conservatively. Never deploy production, add paid services, create ads, add payment methods, expose secrets, or weaken the Destan Instagram hard block unless the repository owner explicitly asks in this task. Run the relevant tests and builds before claiming success."
            --allowedTools "Bash(npm ci),Bash(npm test),Bash(npm run lint),Bash(npm run build),Bash(npx opennextjs-cloudflare build),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
