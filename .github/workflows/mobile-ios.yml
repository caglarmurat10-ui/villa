name: Mobile iOS Compile

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cloudflare-migration
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ios.yml"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: TypeScript and Vite build
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Compile iOS simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Villa-Yonetim-iOS-simulator
          path: mobile/ios/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
