name: Temporary Destan Instagram Activation

on:
  push:
    branches:
      - agent/cloudflare-migration

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloudflare-migration
          fetch-depth: 0

      - name: Activate verified Destan Instagram safely
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:140]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # 1) Destan Instagram becomes a normal active Meta target after successful OAuth.
          replace(
              'src/lib/social-account-policy.ts',
              '  blocked: true as const,\n  reason: "Meta Business Portfolio / hesap sahipliği sorunu çözülene kadar bağlantı ve yayın devre dışı.",',
              '  blocked: false as boolean,\n  reason: "Instagram OAuth bağlantısı başarıyla doğrulandı; Destan Instagram aktif Meta hedefidir.",'
          )
          replace(
              'src/lib/social-account-policy.ts',
              '  { villa: "Destan", platform: "Facebook" },\n] as const satisfies readonly MetaTarget[];',
              '  { villa: "Destan", platform: "Facebook" },\n  { villa: "Destan", platform: "Instagram" },\n] as const satisfies readonly MetaTarget[];'
          )
          replace(
              'src/lib/social-account-policy.ts',
              '  return villa === DESTAN_INSTAGRAM_HARD_BLOCK.villa && platform === DESTAN_INSTAGRAM_HARD_BLOCK.platform;',
              '  return DESTAN_INSTAGRAM_HARD_BLOCK.blocked && villa === DESTAN_INSTAGRAM_HARD_BLOCK.villa && platform === DESTAN_INSTAGRAM_HARD_BLOCK.platform;'
          )
          replace(
              'src/lib/social-account-policy.ts',
              '// Organik yayın için fiilen desteklenen hedefler. Destan Instagram bilinçli olarak bu listede yoktur;\n// hem cron hem manuel publish endpoint\'i ayrıca HARD BLOCK uygular.',
              '// Organik yayın için fiilen desteklenen Meta hedefleri. Destan Instagram OAuth bağlantısı\n// 2026-09-05 tarihinde başarıyla doğrulandığı için aktif hedefler arasına alınmıştır.'
          )

          # 2) Never flush the historical Destan IG queue. 2026-09-06 and later may publish normally.
          replace(
              'custom-worker.mjs',
              "AND NOT (villa = 'Destan' AND platform = 'Instagram')",
              "AND NOT (villa = 'Destan' AND platform = 'Instagram' AND scheduled_date <= '2026-09-05')"
          )
          replace(
              'src/app/api/meta/instagram/publish/route.ts',
              '  if (post.villa === "Destan") {',
              '  if (post.villa === "Destan" && post.scheduledDate <= "2026-09-05") {'
          )
          replace(
              'src/app/api/meta/instagram/publish/route.ts',
              '    return Response.json({ error: "Villa Destan Instagram hesabı için bağlantı/sahiplik sorunu çözülene kadar yayın devre dışı bırakıldı." }, { status: 409 });',
              '    return Response.json({ error: "Villa Destan Instagram eski bekleyen içerikleri güvenlik nedeniyle yeniden yayınlanmaz. 6 Eylül 2026 ve sonrası planlar aktiftir." }, { status: 409 });'
          )

          # 3) Planner now produces future Destan Instagram rows too.
          replace(
              'src/lib/social-plan-seed.ts',
              '    // Faz 5 son denetim düzeltmesi (bölüm 11) - Destan Instagram HARD BLOCK\'u yalnız cron/publish\n    // route katmanına bırakmak yerine, planlayıcı aşamasında da bu kombinasyon hiç ÜRETİLMEZ\n    // ("tercihen planner aşamasında da platformu üretme"). Aşağıdaki cron (duePosts,\n    // custom-worker.mjs) ve manuel publish route (route.ts) guard\'ları DEĞİŞMEDEN, bağımsız bir\n    // ikinci savunma katmanı olarak kalmaya devam eder.\n    if (template.villa !== "Destan") {\n      inputs.push({ villa: template.villa, platform: "Instagram", contentType: template.contentType, scheduledDate: slot.date, caption: template.caption, mediaUrl, mediaUrls });\n    }',
              '    // Her iki villanın Instagram hesabı aktiftir. Eski Destan kuyruğunun yeniden yayınlanmasını\n    // engelleyen tarih kesimi cron/publish katmanında korunur; yeni planlar normal üretilir.\n    inputs.push({ villa: template.villa, platform: "Instagram", contentType: template.contentType, scheduledDate: slot.date, caption: template.caption, mediaUrl, mediaUrls });'
          )
          replace(
              'src/lib/social-plan-seed.ts',
              '      // Destan Instagram HARD BLOCK - bayram içeriği dahil, İSTİSNASIZ (bkz. ensureRolling30DayPlan\n      // aynı guard, bağımsız ikinci savunma katmanı).\n      if (villa !== "Destan") {\n        inputs.push({ villa, platform: "Instagram", contentType: "Gönderi", scheduledDate: date, caption, mediaUrl, mediaUrls: [mediaUrl] });\n      }',
              '      // Her iki villa için Instagram + Facebook özel gün içeriği üretilebilir; insan onayı ve\n      // normal yayın güvenlik katmanları aynen geçerlidir.\n      inputs.push({ villa, platform: "Instagram", contentType: "Gönderi", scheduledDate: date, caption, mediaUrl, mediaUrls: [mediaUrl] });'
          )

          # 4) Diagnostics/readiness/health now verify Destan Instagram like the other active targets.
          replace(
              'src/lib/meta-diagnostics.ts',
              '      hardBlocked: [{\n        label: `${DESTAN_INSTAGRAM_HARD_BLOCK.villa} ${DESTAN_INSTAGRAM_HARD_BLOCK.platform}`,\n        reason: DESTAN_INSTAGRAM_HARD_BLOCK.reason,\n      }],',
              '      hardBlocked: DESTAN_INSTAGRAM_HARD_BLOCK.blocked ? [{\n        label: `${DESTAN_INSTAGRAM_HARD_BLOCK.villa} ${DESTAN_INSTAGRAM_HARD_BLOCK.platform}`,\n        reason: DESTAN_INSTAGRAM_HARD_BLOCK.reason,\n      }] : [],'
          )
          replace(
              'src/app/api/meta/health/route.ts',
              '    blocked: [{\n      villa: DESTAN_INSTAGRAM_HARD_BLOCK.villa,\n      platform: DESTAN_INSTAGRAM_HARD_BLOCK.platform,\n      label: DESTAN_INSTAGRAM_HARD_BLOCK.reason,\n    }],',
              '    blocked: DESTAN_INSTAGRAM_HARD_BLOCK.blocked ? [{\n      villa: DESTAN_INSTAGRAM_HARD_BLOCK.villa,\n      platform: DESTAN_INSTAGRAM_HARD_BLOCK.platform,\n      label: DESTAN_INSTAGRAM_HARD_BLOCK.reason,\n    }] : [],'
          )
          replace(
              'src/app/api/meta/publish-readiness/route.ts',
              '    blocked: [{\n      villa: DESTAN_INSTAGRAM_HARD_BLOCK.villa,\n      platform: DESTAN_INSTAGRAM_HARD_BLOCK.platform,\n      reason: DESTAN_INSTAGRAM_HARD_BLOCK.reason,\n    }],',
              '    blocked: DESTAN_INSTAGRAM_HARD_BLOCK.blocked ? [{\n      villa: DESTAN_INSTAGRAM_HARD_BLOCK.villa,\n      platform: DESTAN_INSTAGRAM_HARD_BLOCK.platform,\n      reason: DESTAN_INSTAGRAM_HARD_BLOCK.reason,\n    }] : [],'
          )

          # 5) Desktop UI follows the resolved state.
          replace(
              'src/components/MetaConnections.tsx',
              'Safira Instagram ayrı tutulur. Facebook ise Safira ve Destan için tek ortak Meta OAuth oturumuyla bağlanır;',
              'Instagram hesapları villa bazında ayrı tutulur. Facebook ise Safira ve Destan için tek ortak Meta OAuth oturumuyla bağlanır;'
          )
          replace(
              'src/components/MetaDiagnostics.tsx',
              'Safira Instagram ile Safira ve Destan Facebook bağlantıları tamam.',
              'Safira ve Destan Instagram/Facebook bağlantıları tamam.'
          )
          replace(
              'src/components/MetaHealthCheck.tsx',
              'Şifreli kayıtlı tokenları yalnız aktif Meta hedeflerinde API üzerinden doğrular. Destan Instagram HARD BLOCK nedeniyle teste ve yayına alınmaz. Token değeri ekrana veya tarayıcıya gönderilmez.',
              'Şifreli kayıtlı tokenları tüm aktif Meta hedeflerinde API üzerinden doğrular. Safira ve Destan Instagram/Facebook bağlantıları birlikte test edilir. Token değeri ekrana veya tarayıcıya gönderilmez.'
          )
          replace(
              'src/components/MetaPublishTestCenter.tsx',
              '✓ Üç aktif Meta hedefi ve doğrulanmış Drive medya havuzu yayın testine hazır. Destan Instagram HARD BLOCK olarak dışarıda tutuluyor.',
              '✓ Dört aktif Meta hedefi ve doğrulanmış Drive medya havuzu yayın testine hazır.'
          )
          replace(
              'src/components/MetaPublishTestCenter.tsx',
              'Bu merkez aktif Meta hedeflerini, yayın kotasını ve doğrulanmış Safira/Destan medya havuzunu kontrol eder. Safira Instagram ile iki Facebook Sayfası desteklenir; Destan Instagram sahiplik sorunu çözülene kadar HARD BLOCK\'tur. Test planları otomatik hazırlanabilir ancak insan onayı verilmeden hiçbir içerik Meta\'ya gönderilmez.',
              'Bu merkez aktif Meta hedeflerini, yayın kotasını ve doğrulanmış Safira/Destan medya havuzunu kontrol eder. Safira ve Destan Instagram ile iki Facebook Sayfası desteklenir. Test planları otomatik hazırlanabilir ancak insan onayı verilmeden hiçbir içerik Meta\'ya gönderilmez.'
          )
          replace('src/components/MetaPublishTestCenter.tsx', '"3 güvenli yayın planı hazırla"', '"4 güvenli yayın planı hazırla"')
          replace('src/components/MetaPublishTestCenter.tsx', '{plans.length}/3 aktif plan bulundu', '{plans.length}/4 aktif plan bulundu')
          replace(
              'src/app/api/meta/smoke-plans/route.ts',
              '    message: `${META_ACTIVE_TARGETS.length} kontrollü yayın planı hazırlandı. Destan Instagram HARD BLOCK nedeniyle plana alınmaz. Hiçbiri insan onayı olmadan Meta\'ya gönderilmez.`,',
              '    message: `${META_ACTIVE_TARGETS.length} kontrollü yayın planı hazırlandı. Tüm aktif Meta hedefleri kapsanır. Hiçbiri insan onayı olmadan Meta\'ya gönderilmez.`,',
          )

          # 6) Mobile APIs stop reporting the resolved hard block.
          replace(
              'src/app/api/mobile/v1/social/route.ts',
              'import { getPostAutomationClasses } from "@/lib/social-library-summary";\n',
              'import { getPostAutomationClasses } from "@/lib/social-library-summary";\nimport { isMetaTargetHardBlocked } from "@/lib/social-account-policy";\n'
          )
          replace(
              'src/app/api/mobile/v1/social/route.ts',
              '      destanInstagramHardBlocked: p.villa === "Destan" && p.platform === "Instagram",',
              '      destanInstagramHardBlocked: isMetaTargetHardBlocked(p.villa, p.platform),'
          )
          replace(
              'src/app/api/mobile/v1/dashboard/route.ts',
              'import type { Reservation } from "@/lib/types";\n',
              'import type { Reservation } from "@/lib/types";\nimport { DESTAN_INSTAGRAM_HARD_BLOCK } from "@/lib/social-account-policy";\n'
          )
          replace(
              'src/app/api/mobile/v1/dashboard/route.ts',
              '      destanInstagramHardBlocked: true,',
              '      destanInstagramHardBlocked: DESTAN_INSTAGRAM_HARD_BLOCK.blocked,'
          )

          # Remove the always-visible stale mobile warning card. Per-post badge remains policy-driven.
          mobile = Path('mobile/src/screens/SocialScreen.tsx')
          text = mobile.read_text(encoding='utf-8')
          start = text.index('        <div className="card" style={{ borderColor: "#a16207", marginTop: 4 }}>')
          end_marker = '        <div style={{ display: "flex", gap: 8, margin: "14px 0 10px" }}>'
          end = text.index(end_marker, start)
          text = text[:start] + end_marker + text[end + len(end_marker):]
          text = text.replace('  const [warningOpen, setWarningOpen] = useState(false);\n', '')
          mobile.write_text(text, encoding='utf-8')

          # 7) Publish-health card is data driven after the policy transition.
          p = Path('src/components/SocialPublishHealth.tsx')
          text = p.read_text(encoding='utf-8')
          old = '          <div style={{padding:"8px 10px",border:"1px solid #a16207",borderRadius:9,background:"#241a06",color:"#fbbf24"}}>HARD BLOCK (Destan IG)<br /><b style={{fontSize:15}}>{destanIgWaiting.length}</b></div>'
          if text.count(old) != 1:
              raise SystemExit(f'SocialPublishHealth hard-block count card occurrence={text.count(old)}')
          text = text.replace(old, '          {destanIgWaiting.length > 0 ? <div style={{padding:"8px 10px",border:"1px solid #a16207",borderRadius:9,background:"#241a06",color:"#fbbf24"}}>HARD BLOCK (Destan IG)<br /><b style={{fontSize:15}}>{destanIgWaiting.length}</b></div> : null}')
          p.write_text(text, encoding='utf-8')

          # 8) Update regression tests to assert the new safe activation, not the obsolete hard block.
          replace(
              'src/lib/social-account-policy.test.ts',
              '  it("yalnız desteklenen üç organik hedefi aktif sayar", () => {\n    expect(META_ACTIVE_TARGETS).toEqual([\n      { villa: "Safira", platform: "Instagram" },\n      { villa: "Safira", platform: "Facebook" },\n      { villa: "Destan", platform: "Facebook" },\n    ]);\n  });\n\n  it("Destan Instagram\'i HARD BLOCK olarak tutar", () => {\n    expect(DESTAN_INSTAGRAM_HARD_BLOCK.blocked).toBe(true);\n    expect(isMetaTargetHardBlocked("Destan", "Instagram")).toBe(true);',
              '  it("dört organik Meta hedefini aktif sayar", () => {\n    expect(META_ACTIVE_TARGETS).toEqual([\n      { villa: "Safira", platform: "Instagram" },\n      { villa: "Safira", platform: "Facebook" },\n      { villa: "Destan", platform: "Facebook" },\n      { villa: "Destan", platform: "Instagram" },\n    ]);\n  });\n\n  it("Destan Instagram OAuth doğrulaması sonrası HARD BLOCK değildir", () => {\n    expect(DESTAN_INSTAGRAM_HARD_BLOCK.blocked).toBe(false);\n    expect(isMetaTargetHardBlocked("Destan", "Instagram")).toBe(false);'
          )
          replace(
              'src/lib/social-guards.test.ts',
              'describe("Destan Instagram HARD BLOCK regresyonu", () => {\n  it("cron aday sorgusu villa=Destan + platform=Instagram\'i disliyor (custom-worker.mjs)", () => {\n    const source = readFileSync(resolve(ROOT, "custom-worker.mjs"), "utf-8");\n    expect(source).toContain("NOT (villa = \'Destan\' AND platform = \'Instagram\')");\n  });\n\n  it("manuel/admin publish route\'u Destan icin sert reddediyor (route.ts)", () => {',
              'describe("Destan Instagram güvenli aktivasyon regresyonu", () => {\n  it("cron yalnız 2026-09-05 ve önceki Destan Instagram backlog\'unu dışlıyor", () => {\n    const source = readFileSync(resolve(ROOT, "custom-worker.mjs"), "utf-8");\n    expect(source).toContain("NOT (villa = \'Destan\' AND platform = \'Instagram\' AND scheduled_date <= \'2026-09-05\')");\n  });\n\n  it("manuel/admin publish route eski Destan backlog\'unu Graph çağrısından önce reddediyor", () => {'
          )
          replace(
              'src/lib/social-guards.test.ts',
              '    expect(source).toContain(\'post.villa === "Destan"\');',
              '    expect(source).toContain(\'post.villa === "Destan" && post.scheduledDate <= "2026-09-05"\');'
          )
          replace(
              'src/lib/social-plan-seed.test.ts',
              '// davranışını doğrular: AUTO_SAFE -> approval_status=\'Onaylandı\', Destan+Instagram hiç üretilmez,',
              '// davranışını doğrular: AUTO_SAFE -> approval_status=\'Onaylandı\', dört Meta hedefi üretilebilir,'
          )
          replace(
              'src/lib/social-plan-seed.test.ts',
              '  it("Destan + Instagram kombinasyonu planlayıcı tarafından HİÇ üretilmez (HARD BLOCK, planlama aşamasında)", async () => {\n    const { ensureRolling30DayPlan } = await import("./social-plan-seed");\n    await ensureRolling30DayPlan(4); // birden fazla villa/platform üretmeye zorla\n    const rows = await socialPostRows();\n    expect(rows.some((r) => r.villa === "Destan" && r.platform === "Instagram")).toBe(false);\n  });',
              '  it("Destan + Instagram kombinasyonu aktif bağlantı sonrası planlayıcı tarafından üretilebilir", async () => {\n    const { ensureRolling30DayPlan } = await import("./social-plan-seed");\n    await ensureRolling30DayPlan(4);\n    const rows = await socialPostRows();\n    expect(rows.some((r) => r.villa === "Destan" && r.platform === "Instagram")).toBe(true);\n  });'
          )
          replace(
              'src/lib/social-plan-seed.test.ts',
              '  it("Destan + Instagram kombinasyonu bayram icerigi icin de HIC uretilmez (HARD BLOCK istisnasiz)", async () => {\n    const { ensureSpecialDayPosts } = await import("./social-plan-seed");\n    await ensureSpecialDayPosts();\n    const rows = await socialPostRows();\n    expect(rows.some((r) => r.villa === "Destan" && r.platform === "Instagram")).toBe(false);\n    // Ama Destan Facebook ve Safira Instagram/Facebook uretilmis olmali.\n    expect(rows.some((r) => r.villa === "Destan" && r.platform === "Facebook")).toBe(true);\n    expect(rows.some((r) => r.villa === "Safira" && r.platform === "Instagram")).toBe(true);\n  });',
              '  it("Destan + Instagram kombinasyonu özel gün içeriği için de üretilebilir", async () => {\n    const { ensureSpecialDayPosts } = await import("./social-plan-seed");\n    await ensureSpecialDayPosts();\n    const rows = await socialPostRows();\n    expect(rows.some((r) => r.villa === "Destan" && r.platform === "Instagram")).toBe(true);\n    expect(rows.some((r) => r.villa === "Destan" && r.platform === "Facebook")).toBe(true);\n    expect(rows.some((r) => r.villa === "Safira" && r.platform === "Instagram")).toBe(true);\n  });'
          )

          print('Destan Instagram activation patch applied.')
          PY

      - name: Show remaining stale hard-block references
        shell: bash
        run: |
          grep -R -n -E 'Destan Instagram.*(HARD BLOCK|kapalı|sahiplik|bekleniyor)|HARD BLOCK \(Destan IG\)' src mobile custom-worker.mjs --include='*.ts' --include='*.tsx' --include='*.mjs' || true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Commit activation and remove this temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-destan-instagram-activation.yml
          git add custom-worker.mjs src mobile
          git commit -m 'Activate verified Destan Instagram safely'
          git push origin HEAD:agent/cloudflare-migration
