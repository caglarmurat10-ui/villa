name: Apply WhatsApp villa naming fix

on:
  push:
    branches:
      - agent/cloudflare-migration

permissions:
  contents: write

jobs:
  fix-source-copies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloudflare-migration
          fetch-depth: 0

      - name: Normalize WhatsApp villa naming in source copies
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("src/components/Dashboard.tsx"): [
                  ("${reservation.villa} Villa", "Villa ${reservation.villa}"),
                  ("${r.villa} Villa", "Villa ${r.villa}"),
              ],
              Path("src/components/VillaCalendarWorkspace.tsx"): [
                  ("${item.villa} Villa", "Villa ${item.villa}"),
              ],
          }

          for path, pairs in replacements.items():
              source = path.read_text(encoding="utf-8")
              updated = source
              for old, new in pairs:
                  updated = updated.replace(old, new)
              if updated == source:
                  print(f"No replacement needed in {path}")
              else:
                  path.write_text(updated, encoding="utf-8")
                  print(f"Updated {path}")

          dashboard = Path("src/components/Dashboard.tsx").read_text(encoding="utf-8")
          calendar = Path("src/components/VillaCalendarWorkspace.tsx").read_text(encoding="utf-8")
          assert "${reservation.villa} Villa" not in dashboard
          assert "${r.villa} Villa" not in dashboard
          assert "${item.villa} Villa" not in calendar
          assert "Villa ${reservation.villa}" in dashboard
          assert "Villa ${item.villa}" in calendar

      - name: Remove temporary workflow and commit the source fix
        shell: bash
        run: |
          rm -f .github/workflows/temp-whatsapp-villa-name-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix: normalize WhatsApp villa names"
          git push origin HEAD:agent/cloudflare-migration
