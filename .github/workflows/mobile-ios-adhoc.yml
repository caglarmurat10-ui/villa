name: Mobile iOS Ad Hoc

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adhoc:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.safiradestan.villayonetim
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ADHOC_PROFILE_NAME: Villa Yonetim AdHoc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build web app
        working-directory: mobile
        run: npm run build

      - name: Sync Capacitor iOS
        working-directory: mobile
        run: npx cap sync ios

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Ensure Ad Hoc provisioning profile
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPLE_CERT_SERIAL: 794ED233DE997324097E0EF918B79FA9
        run: python3 tools/ensure_adhoc.py

      - name: Download Ad Hoc provisioning profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.safiradestan.villayonetim
          profile-type: IOS_APP_ADHOC
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Resolve Ad Hoc profile
        run: |
          set -euo pipefail
          FOUND=''
          for p in "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision; do
            [ -f "$p" ] || continue
            security cms -D -i "$p" > /tmp/villa-adhoc-profile.plist
            NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/villa-adhoc-profile.plist 2>/dev/null || true)
            APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/villa-adhoc-profile.plist 2>/dev/null || true)
            FIRST_DEVICE=$(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices:0' /tmp/villa-adhoc-profile.plist 2>/dev/null || true)
            if [[ "$NAME" == "$ADHOC_PROFILE_NAME" && "$APP_ID" == *".$BUNDLE_ID" && -n "$FIRST_DEVICE" ]]; then
              FOUND="$NAME"
              break
            fi
          done
          test -n "$FOUND"
          echo "PROFILE_NAME=$FOUND" >> "$GITHUB_ENV"

      - name: Archive signed iOS app
        working-directory: mobile
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((2000 + GITHUB_RUN_NUMBER))
          echo "VILLA_ADHOC_BUILD=$BUILD_NUMBER" >> "$GITHUB_ENV"
          rm -rf ios/build-archive ios/build-ipa
          mkdir -p ios/build-archive ios/build-ipa
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/build-archive/App.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Export Ad Hoc IPA
        working-directory: mobile
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>ad-hoc</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>$APPLE_TEAM_ID</string>
          <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          plutil -lint ios/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath ios/build-archive/App.xcarchive \
            -exportPath ios/build-ipa \
            -exportOptionsPlist ios/ExportOptions.plist
          IPA=$(find ios/build-ipa -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          cp "$IPA" ios/build-ipa/Villa-Yonetim-AdHoc.ipa

      - name: Create OTA manifest
        working-directory: mobile
        run: |
          TAG="villa-adhoc-${VILLA_ADHOC_BUILD}"
          IPA_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Villa-Yonetim-AdHoc.ipa"
          cat > ios/build-ipa/manifest.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array><dict>
          <key>assets</key><array><dict><key>kind</key><string>software-package</string><key>url</key><string>${IPA_URL}</string></dict></array>
          <key>metadata</key><dict>
          <key>bundle-identifier</key><string>${BUNDLE_ID}</string>
          <key>bundle-version</key><string>${VILLA_ADHOC_BUILD}</string>
          <key>kind</key><string>software</string>
          <key>title</key><string>Villa Yonetim</string>
          </dict></dict></array></dict></plist>
          EOF
          plutil -lint ios/build-ipa/manifest.plist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: villa-yonetim-adhoc-${{ env.VILLA_ADHOC_BUILD }}
          path: |
            mobile/ios/build-ipa/Villa-Yonetim-AdHoc.ipa
            mobile/ios/build-ipa/manifest.plist
          retention-days: 30

      - name: Publish installable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="villa-adhoc-${VILLA_ADHOC_BUILD}"
          gh release create "$TAG" mobile/ios/build-ipa/Villa-Yonetim-AdHoc.ipa mobile/ios/build-ipa/manifest.plist \
            --title "Villa Yonetim Ad Hoc ${VILLA_ADHOC_BUILD}" \
            --notes "Private family-device Ad Hoc build. Installs only on Apple Developer-registered devices."
