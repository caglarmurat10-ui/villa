name: Temporary SEO Validation

on:
  push:
    branches:
      - agent/cloudflare-migration
    paths:
      - "src/app/site/**"
      - "src/lib/region-guide-pages.ts"
      - "src/lib/region-guide-pages.test.ts"
      - "src/lib/public-villa-seo.ts"
      - "src/lib/public-villa-seo.test.ts"
      - ".github/workflows/seo-validation-temporary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without rewriting repository lockfile
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
