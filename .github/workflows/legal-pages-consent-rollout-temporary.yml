name: Temporary Legal Pages Consent Rollout

on:
  push:
    branches:
      - agent/cloudflare-migration
    paths:
      - ".github/workflows/legal-pages-consent-rollout-temporary.yml"

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/cloudflare-migration

      - name: Apply standalone legal pages and consent enforcement
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Unsafe patch refused for {path}: expected one match, found {text.count(old)}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          write("src/lib/legal-content.ts", r'''export const LEGAL_PAGE_SLUGS = [
