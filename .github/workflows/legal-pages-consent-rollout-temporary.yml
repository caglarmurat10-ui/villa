              write(f"src/app/site/{slug}/page.tsx", f'''import LegalInfoPage, {{ buildLegalMetadata }} from "@/components/LegalInfoPage";\nimport {{ LEGAL_PAGES }} from "@/lib/legal-content";\n\nconst page = LEGAL_PAGES["{slug}"];\n\nexport const metadata = buildLegalMetadata(page);\n\nexport default function Page() {{\n  return <LegalInfoPage page={{page}} />;\n}}\n''')

          write("src/app/site/rezervasyon-kosullari/page.tsx", r'''import type { Metadata } from "next";
          import Link from "next/link";
