name: Temporary Social Growth Validation

on:
  push:
    branches:
      - agent/cloudflare-migration
    paths:
      - ".github/workflows/social-growth-validation-temporary.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

