name: Mobile Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - agent/cloudflare-migration
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install mobile dependencies
        run: npm ci

      - name: TypeScript and Vite build
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build unsigned release APK and AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Villa-Yonetim-Android-1.1.0-unsigned
          path: |
            mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 3
