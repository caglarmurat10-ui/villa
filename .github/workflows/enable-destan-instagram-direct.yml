name: Enable Destan Instagram Direct Publishing

on:
  push:
    branches:
      - agent/cloudflare-migration
    paths:
      - .github/workflows/enable-destan-instagram-direct.yml

permissions:
  contents: write

jobs:
  patch-worker-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: agent/cloudflare-migration
          fetch-depth: 0

      - name: Align direct Destan Instagram publishing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path('custom-worker.mjs')
          text = worker.read_text(encoding='utf-8')
          old = 'const DESTAN_INSTAGRAM_HARD_BLOCKED = true;'
          new = 'const DESTAN_INSTAGRAM_HARD_BLOCKED = false;'
          if old not in text and new not in text:
              raise SystemExit('Expected Destan Instagram worker guard was not found')
          if old in text:
              text = text.replace(old, new, 1)
          worker.write_text(text, encoding='utf-8')

          panel = Path('src/components/IntegrationCenterPanel.tsx')
          text = panel.read_text(encoding='utf-8')
          old = 'const metaOrganicOk = snapshot.metaOrganic.safiraInstagramConnected && snapshot.metaOrganic.safiraFacebookConnected && snapshot.metaOrganic.destanFacebookConnected;'
          new = 'const metaOrganicOk = snapshot.metaOrganic.safiraInstagramConnected && snapshot.metaOrganic.safiraFacebookConnected && snapshot.metaOrganic.destanFacebookConnected && snapshot.metaOrganic.destanInstagramConnected && !snapshot.metaOrganic.destanInstagramHardBlocked;'
          if old not in text and new not in text:
              raise SystemExit('Expected Meta organic readiness expression was not found')
          if old in text:
              text = text.replace(old, new, 1)
          panel.write_text(text, encoding='utf-8')
          PY

      - name: Commit source alignment
        shell: bash
        run: |
          if git diff --quiet -- custom-worker.mjs src/components/IntegrationCenterPanel.tsx; then
            echo "Direct Destan Instagram publishing is already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom-worker.mjs src/components/IntegrationCenterPanel.tsx
          git commit -m "Align Destan Instagram independent channel status"
          git push origin HEAD:agent/cloudflare-migration
