name: Enable Destan Instagram Direct Publishing

on:
  push:
    branches:
      - agent/cloudflare-migration
    paths:
      - .github/workflows/enable-destan-instagram-direct.yml

permissions:
  contents: write

jobs:
  patch-worker-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: agent/cloudflare-migration
          fetch-depth: 0

      - name: Enable direct Destan Instagram cron target
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('custom-worker.mjs')
          text = path.read_text(encoding='utf-8')
          old = 'const DESTAN_INSTAGRAM_HARD_BLOCKED = true;'
          new = 'const DESTAN_INSTAGRAM_HARD_BLOCKED = false;'
          if old not in text and new not in text:
              raise SystemExit('Expected Destan Instagram worker guard was not found')
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit worker source patch
        shell: bash
        run: |
          if git diff --quiet -- custom-worker.mjs; then
            echo "Worker already uses direct Destan Instagram publishing."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom-worker.mjs
          git commit -m "Enable Destan Instagram direct cron publishing"
          git push origin HEAD:agent/cloudflare-migration
