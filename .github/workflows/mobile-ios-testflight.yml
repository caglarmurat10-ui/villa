name: Mobile iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "App Store Connect'e yukle (app kaydi mevcut olmali)"
        type: boolean
        default: true
  # Surum etiketi atildiginda otomatik signed build + TestFlight yuklemesi.
  # Her push'ta tetiklenmez: build numarasi projede sabit oldugu icin ayni build'i
  # tekrar yuklemek App Store Connect tarafinda "duplicate build" hatasi verir.
  push:
    tags:
      - "villa-mobile-v*"

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.safiradestan.villayonetim
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      EXPECTED_MARKETING_VERSION: "1.2.0"
      EXPECTED_BUILD_NUMBER: "7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Apple configuration
        env:
          ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          CERT_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID ISSUER_ID API_KEY_ID API_PRIVATE_KEY CERT_BASE64 CERT_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Eksik Apple/GitHub ayari: $name"
              exit 1
            fi
          done
          echo "Apple yapilandirmasi tam."

      - name: Verify iOS version and build number
        working-directory: mobile
        run: |
          set -euo pipefail
          PBX=ios/App/App.xcodeproj/project.pbxproj
          MV=$(grep -m1 'MARKETING_VERSION' "$PBX" | sed 's/.*= *//; s/;//' | tr -d ' ')
          CPV=$(grep -m1 'CURRENT_PROJECT_VERSION' "$PBX" | sed 's/.*= *//; s/;//' | tr -d ' ')
          BID=$(grep -m1 'PRODUCT_BUNDLE_IDENTIFIER' "$PBX" | sed 's/.*= *//; s/;//' | tr -d ' ')
          echo "MARKETING_VERSION=$MV CURRENT_PROJECT_VERSION=$CPV BUNDLE=$BID"
          test "$MV" = "$EXPECTED_MARKETING_VERSION"
          test "$CPV" = "$EXPECTED_BUILD_NUMBER"
          test "$BID" = "$BUNDLE_ID"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: TypeScript and Vite build
        working-directory: mobile
        run: npm run build

      - name: Sync Capacitor iOS
        working-directory: mobile
        run: npx cap sync ios

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.safiradestan.villayonetim
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Resolve downloaded provisioning profile
        run: |
          set -euo pipefail
          FOUND=""
          for p in "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision; do
            [ -f "$p" ] || continue
            security cms -D -i "$p" > /tmp/villa-profile.plist
            APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/villa-profile.plist 2>/dev/null || true)
            if [[ "$APP_ID" == *".$BUNDLE_ID" ]]; then
              FOUND=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/villa-profile.plist)
              break
            fi
          done
          test -n "$FOUND"
          echo "Profil bulundu: $FOUND"
          echo "PROFILE_NAME=$FOUND" >> "$GITHUB_ENV"

      - name: Archive signed iOS app
        working-directory: mobile
        run: |
          set -euo pipefail
          rm -rf ios/build-archive ios/build-ipa
          mkdir -p ios/build-archive ios/build-ipa
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/build-archive/App.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Create export options
        working-directory: mobile
        run: |
          set -euo pipefail
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          plutil -lint ios/ExportOptions.plist

      - name: Export signed IPA
        working-directory: mobile
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath ios/build-archive/App.xcarchive \
            -exportPath ios/build-ipa \
            -exportOptionsPlist ios/ExportOptions.plist
          IPA_PATH="$(find ios/build-ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          echo "IPA_PATH=mobile/$IPA_PATH" >> "$GITHUB_ENV"

      - name: Verify signed IPA
        working-directory: mobile
        run: |
          set -euo pipefail
          IPA="$(find ios/build-ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          rm -rf /tmp/villa-ipa-check && mkdir -p /tmp/villa-ipa-check
          unzip -q "$IPA" -d /tmp/villa-ipa-check
          APP_DIR="$(find /tmp/villa-ipa-check/Payload -maxdepth 1 -name '*.app' -print -quit)"
          PLIST="$APP_DIR/Info.plist"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          echo "IPA bundle id      : $BID"
          echo "IPA version        : $SHORT"
          echo "IPA build          : $BUILD"
          echo "IPA boyut (bayt)   : $(stat -f%z "$IPA")"
          echo "IPA SHA-256        : $(shasum -a 256 "$IPA" | awk '{print $1}')"
          echo "--- codesign ---"
          codesign -dv --verbose=2 "$APP_DIR" 2>&1 | grep -E 'Authority|TeamIdentifier|Identifier=' || true
          echo "--- entitlements (app id) ---"
          codesign -d --entitlements :- "$APP_DIR" 2>/dev/null | grep -A1 'application-identifier' | head -4 || true
          test "$BID" = "$BUNDLE_ID"
          test "$SHORT" = "$EXPECTED_MARKETING_VERSION"
          test "$BUILD" = "$EXPECTED_BUILD_NUMBER"
          codesign -dv --verbose=2 "$APP_DIR" 2>&1 | grep -q 'Authority=Apple Distribution'
          echo "IPA dogrulamasi PASS"

      - name: Keep signed IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Villa-Yonetim-iOS-1.2.0-build7-signed
          path: mobile/ios/build-ipa/*.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload to TestFlight
        # Etiket tetiklemesinde her zaman yukle; manuel calistirmada girdiye uy.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_to_testflight }}
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: 'false'
          wait-for-processing: 'true'

      - name: Install post-upload dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_to_testflight }}
        working-directory: ${{ github.workspace }}
        # macOS runner'in Python'u Homebrew tarafindan yonetiliyor (PEP 668), sisteme
        # dogrudan pip kurulumu reddediliyor. Izole bir venv kullaniyoruz.
        run: |
          set -euo pipefail
          python3 -m venv .tf-venv
          .tf-venv/bin/python -m pip install --quiet --upgrade pip
          .tf-venv/bin/python -m pip install --quiet pyjwt cryptography

      - name: Export compliance and internal TestFlight group
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_to_testflight }}
        working-directory: ${{ github.workspace }}
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          BUILD_VERSION: "7"
        run: .tf-venv/bin/python scripts/testflight-post-upload.py
