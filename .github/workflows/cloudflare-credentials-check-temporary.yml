name: Temporary Cloudflare Credential Check

on:
  push:
    branches:
      - agent/cloudflare-migration
    paths:
      - ".github/workflows/cloudflare-credentials-check-temporary.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Report credential availability only
        shell: bash
        run: |
          token=no
          account=no
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || [ -n "${CF_API_TOKEN:-}" ]; then token=yes; fi
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -n "${CF_ACCOUNT_ID:-}" ]; then account=yes; fi
          echo "cloudflare_api_token_present=$token"
          echo "cloudflare_account_id_present=$account"
